[workspace]
resolver = "2"
members = ["crates/ethos-model", "crates/ethos-model-validation", "crates/ethos-model-cli", "crates/ethos-model-desktop"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
